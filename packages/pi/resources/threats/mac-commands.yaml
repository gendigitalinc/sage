# --- osascript Remote Code Execution ---

# osascript -e 'do shell script' (AppleScript shell execution)
- id: "CLT-MAC-CMD-001"
  version: 1
  detection_name: "CMD:SageMacOSCommand-A [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}osascript{{NOT_FILENAME}}.*-e.*do shell script"
  case_insensitive: true
  match_on: command
  title: "AppleScript shell execution via osascript -e"
  expires_at: null
  revoked: false

# osascript -l JavaScript (JXA execution)
- id: "CLT-MAC-CMD-002"
  version: 1
  detection_name: "CMD:SageMacOSCommand-B [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}osascript{{NOT_FILENAME}}.*-l\\s+JavaScript"
  case_insensitive: true
  match_on: command
  title: "JavaScript for Automation (JXA) execution via osascript"
  expires_at: null
  revoked: false

# Pipe to osascript (stdin AppleScript execution)
- id: "CLT-MAC-CMD-003"
  version: 1
  detection_name: "CMD:SageMacOSCommand-C [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{NOT_FILENAME}} rejects a longer identifier (`osascriptable-formatter`);
  # the pipe itself is already a real command-position boundary, so a full
  # {{CMD_POS}} isn't needed here.
  pattern: "\\|\\s*osascript{{NOT_FILENAME}}"
  match_on: command
  title: "Piped input to osascript (stdin AppleScript execution)"
  expires_at: null
  revoked: false

# osascript loading script file from remote download
- id: "CLT-MAC-CMD-004"
  version: 1
  detection_name: "CMD:SageMacOSCommand-D [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}} on both leading AND trailing identifiers of
  # each alternative, same shape as CLT-CMD-009. Had no boundary at all. The
  # trailing {{NOT_FILENAME}} matters here too -- without it, "osascript" and
  # "curl"/"wget" match as substrings of longer identifiers
  # (osascriptable-tool, start_curling_service).
  pattern: "{{CMD_POS}}(curl|wget){{NOT_FILENAME}}.*\\|.*osascript{{NOT_FILENAME}}|{{CMD_POS}}osascript{{NOT_FILENAME}}.*(curl|wget){{NOT_FILENAME}}"
  case_insensitive: true
  match_on: command
  title: "Remote script download piped to osascript"
  expires_at: null
  revoked: false

