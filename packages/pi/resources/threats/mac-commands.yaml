# defaults write LSQuarantine (quarantine flag disable)
- id: "CLT-MAC-CMD-018"
  version: 1
  detection_name: "CMD:SageMacOSCommand-R [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}} on `defaults`, same shape as CLT-CMD-009.
  # The inner `\bwrite\b` is left as bare -- only reachable once `defaults`
  # has already matched at command position.
  pattern: "{{CMD_POS}}defaults{{NOT_FILENAME}}.*\\bwrite\\b.*LSQuarantine"
  case_insensitive: true
  match_on: command
  title: "Quarantine flag disable via defaults write LSQuarantine"
  expires_at: null
  revoked: false

