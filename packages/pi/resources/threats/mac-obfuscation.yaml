# osascript 'do shell script' wrapping (shell via AppleScript)
- id: "CLT-MAC-OBFUS-001"
  version: 1
  detection_name: "CMD:SageMacOSObfuscation-A [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}osascript{{NOT_FILENAME}}.*do shell script"
  case_insensitive: true
  match_on: command
  title: "Shell command obfuscated via AppleScript do shell script"
  expires_at: null
  revoked: false

# JXA (JavaScript for Automation) execution
- id: "CLT-MAC-OBFUS-002"
  version: 1
  detection_name: "CMD:SageMacOSObfuscation-B [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}osascript{{NOT_FILENAME}}.*-l\\s+JavaScript.*-e"
  case_insensitive: true
  match_on: command
  title: "JXA inline execution (JavaScript for Automation obfuscation)"
  expires_at: null
  revoked: false

# Base64 decode piped to osascript
- id: "CLT-MAC-OBFUS-003"
  version: 1
  detection_name: "CMD:SageMacOSObfuscation-C [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{NOT_FILENAME}} on `base64`, same shape as CLT-CMD-009.
  # Had no boundary at all. Trailing {{NOT_FILENAME}} on `osascript` too --
  # without it, a longer identifier like "osascriptable-tool" still matches.
  pattern: "{{CMD_POS}}base64{{NOT_FILENAME}}\\s+(-d|-D|--decode).*\\|.*osascript{{NOT_FILENAME}}"
  match_on: command
  title: "Base64 decode piped to osascript (encoded payload execution)"
  expires_at: null
  revoked: false

