# brew install without version pin
- id: "CLT-MAC-SUPPLY-001"
  version: 1
  detection_name: "CMD:SageMacOSSupplyChain-A [Heur]"
  category: supply_chain
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}brew{{NOT_FILENAME}}\\s+install\\b(?!.*@\\d)"
  match_on: command
  title: "Homebrew install without version pin"
  expires_at: null
  revoked: false

# installer -pkg from remote URL
- id: "CLT-MAC-SUPPLY-002"
  version: 1
  detection_name: "CMD:SageMacOSSupplyChain-B [Heur]"
  category: supply_chain
  severity: warning
  confidence: 0.85
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}installer{{NOT_FILENAME}}.*-pkg.*https?://"
  case_insensitive: true
  match_on: command
  title: "Remote package install via installer -pkg (unsigned)"
  expires_at: null
  revoked: false

# brew install --cask from non-default tap
- id: "CLT-MAC-SUPPLY-003"
  version: 1
  detection_name: "CMD:SageMacOSSupplyChain-C [Heur]"
  category: supply_chain
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}brew{{NOT_FILENAME}}\\s+(install|reinstall)\\s+--cask\\b"
  match_on: command
  title: "Homebrew cask install (binary application)"
  expires_at: null
  revoked: false
