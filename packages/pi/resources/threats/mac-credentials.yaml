# Keychain password extraction (find-generic-password)
- id: "CLT-MAC-CRED-001"
  version: 1
  detection_name: "CMD:SageMacOSCredential-A [Heur]"
  category: secrets
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{NOT_FILENAME}} on `security`, same shape as CLT-CMD-009.
  # The inner `\bfind-generic-password\b` is left as bare -- only reachable
  # once `security` has already matched at command position.
  pattern: "{{CMD_POS}}security{{NOT_FILENAME}}.*\\bfind-generic-password\\b.*-w"
  match_on: command
  title: "Keychain password extraction via security find-generic-password"
  expires_at: null
  revoked: false

