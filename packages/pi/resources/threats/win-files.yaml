# Detects Read/Write/Edit/Delete operations targeting Windows security-sensitive files

# SAM/SECURITY/SYSTEM hive
- id: "CLT-WIN-FILE-001"
  version: 1
  detection_name: "FN:SageWindowsFile-A [Heur]"
  category: secrets
  severity: critical
  confidence: 0.95
  pattern: "(\\\\|/)Windows(\\\\|/)System32(\\\\|/)config(\\\\|/)(SAM|SECURITY|SYSTEM)"
  match_on: file_path
  title: "Access SAM/SECURITY/SYSTEM registry hive"
  expires_at: null
  revoked: false

# NTDS.dit (Active Directory database)
- id: "CLT-WIN-FILE-002"
  version: 1
  detection_name: "FN:SageWindowsFile-B [Heur]"
  category: secrets
  severity: critical
  confidence: 0.95
  pattern: "[Nn][Tt][Dd][Ss]\\.[Dd][Ii][Tt]"
  match_on: file_path
  title: "Access NTDS.dit (Active Directory database)"
  expires_at: null
  revoked: false

