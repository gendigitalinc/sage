# WMI event subscription persistence
- id: "CLT-WIN-PERSIST-008"
  version: 1
  detection_name: "CMD:SageWindowsPersistence-H [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # A WMI class name legitimately appears as an argument value (`-Class
  # CommandLineEventConsumer`), so {{CMD_POS}} would break real detections —
  # only the symmetric boundary guard applies here, plus {{NOT_FILENAME}}
  # (instead of {{NOT_COMPOUND_RIGHT}}) to also reject a trailing dot
  # (`CommandLineEventConsumer.md`) and {{NOT_AFTER_TEXT_CMD}} to reject a
  # mention inside a search/print command (`grep "CommandLineEventConsumer"`)
  # without gating on quotes, which would just hand an attacker a trivial
  # evasion. See {{NOT_AFTER_TEXT_CMD}} in _macros.yaml for the full guard
  # design and its accepted residual gap (an unlisted benign command still
  # false-positives).
  pattern: "{{NOT_AFTER_TEXT_CMD}}{{NOT_COMPOUND_LEFT}}(CommandLineEventConsumer|ActiveScriptEventConsumer){{NOT_FILENAME}}"
  case_insensitive: true
  match_on: command
  title: "WMI event subscription persistence"
  expires_at: null
  revoked: false
