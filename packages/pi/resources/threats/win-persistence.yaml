# PowerShell New-ScheduledTask
- id: "CLT-WIN-PERSIST-004"
  version: 1
  detection_name: "CMD:SageWindowsPersistence-D [Heur]"
  category: tool
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-WIN-CMD-036. Had no
  # boundary at all, so it matched inside the distinct, real cmdlets
  # New-ScheduledTaskAction and New-ScheduledTaskTrigger even when the real
  # New-ScheduledTask was never called.
  pattern: "{{CMD_POS}}[Nn]ew-[Ss]cheduled[Tt]ask{{NOT_FILENAME}}"
  match_on: command
  title: "PowerShell scheduled task creation"
  expires_at: null
  revoked: false

# PowerShell Set-ItemProperty Run key
- id: "CLT-WIN-PERSIST-005"
  version: 1
  detection_name: "CMD:SageWindowsPersistence-E [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-WIN-CMD-036. Had no
  # boundary at all, so it matched inside the distinct, real cmdlet
  # Set-ItemPropertyValue even when Set-ItemProperty itself was never called.
  pattern: "{{CMD_POS}}[Ss]et-[Ii]tem[Pp]roperty{{NOT_FILENAME}}.*\\\\(Run|RunOnce)\\\\"
  match_on: command
  title: "PowerShell Registry Run key persistence"
  expires_at: null
  revoked: false

