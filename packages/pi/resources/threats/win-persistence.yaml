# Covers: Registry Run keys, Services, Task Scheduler, Startup folder

# Registry Run key via reg add
- id: "CLT-WIN-PERSIST-001"
  version: 1
  detection_name: "CMD:SageWindowsPersistence-A [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}[Rr][Ee][Gg](?:\\.exe)?{{NOT_FILENAME}}\\s+[Aa][Dd][Dd].*\\\\(Run|RunOnce)\\\\"
  match_on: command
  title: "Registry Run key persistence via reg add"
  expires_at: null
  revoked: false

