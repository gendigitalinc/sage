# --- Loop-based indirect execution ---
- id: "CLT-CMD-022"
  version: 1
  detection_name: "CMD:SageCommand-V [Heur]"
  category: tool
  severity: warning
  confidence: 0.80
  # {{CMD_POS}} anchors the loop keyword itself so prose merely describing
  # the shape (`echo "for url in $URLS; do curl $url | sh; done ..."`) no
  # longer fires. The bare `\b` on the inner shell/curl/wget mentions is left
  # as-is: they're only reachable once a real `for`/`while ...; do` has
  # already matched at command position, so they aren't an independent
  # prose-mention surface the way the outer keyword was.
  pattern: "{{CMD_POS}}(while|for){{NOT_FILENAME}}[^;]*;\\s*do[^;]*(\\b(?:{{SHELLS}})\\s+-c\\b|\\b(curl|wget)\\b[^;]*\\|\\s*(?:sudo\\s+)?(?:env\\s+)?(?:[^\\s\"']*[\\\\/])?(?:{{SHELLS}})\\b|\\b(curl|wget)\\b[^;]*(?:(-d|--data|--data-binary)\\s+['\\\"]?@\\S+|(--upload-file|-T)\\s+['\\\"]?\\S+))"
  match_on: command
  title: "Loop executing shell or download commands"
  expires_at: null
  revoked: false

