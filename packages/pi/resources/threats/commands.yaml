# --- Privileged pipe to shell ---
- id: "CLT-CMD-014"
  version: 1
  detection_name: "CMD:SageCommand-N [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{NOT_FILENAME}} on `sudo` itself, not on curl/wget --
  # this rule means "privileged", so it must keep requiring the literal
  # `sudo` wrapper rather than folding into {{CMD_POS}}'s generic wrapper
  # allowance (which would also admit the unprivileged case CLT-CMD-001
  # already covers). curl/wget admit an optional .exe suffix, same as
  # CLT-CMD-001/002.
  pattern: "{{CMD_POS}}sudo{{NOT_FILENAME}}\\s+(curl|wget)(?:\\.exe)?{{NOT_FILENAME}}\\s[^|]*\\|\\s*(?:{{SHELLS}}){{NOT_FILENAME}}"
  match_on: command
  title: "Privileged pipe-to-shell (sudo curl/wget piped to shell)"
  expires_at: null
  revoked: false

# --- Python one-liner with dangerous calls ---
# Matches actual call sites (`name(`) rather than bare imports — `import
# subprocess` alone is harmless; `subprocess.run(...)` is what we care about.
# Uses `[\s\S]` to span newlines (loader does not set the `s` flag) and a
# bounded non-greedy quantifier to avoid catastrophic backtracking.
- id: "CLT-CMD-015"
  version: 1
  detection_name: "CMD:SageCommand-O [Heur]"
  category: tool
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009. Had no
  # boundary at all.
  pattern: "{{CMD_POS}}python[3]?{{NOT_FILENAME}}\\s+-c\\s+[\"'][\\s\\S]{0,2048}?(?:os\\.(?:system|popen|exec[lv]?[ep]?e?)|subprocess\\.(?:run|call|Popen|check_output|check_call|getoutput|getstatusoutput)|__import__)\\s*\\("
  match_on: command
  title: "Python one-liner invoking shell/exec/subprocess call"
  expires_at: null
  revoked: false

# --- Indirect execution patterns ---
- id: "CLT-CMD-016"
  version: 1
  detection_name: "CMD:SageCommand-P [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}bash{{NOT_FILENAME}}\\s+<\\(\\s*(curl|wget)\\b"
  match_on: command
  title: "Process substitution executing remote content"
  expires_at: null
  revoked: false

- id: "CLT-CMD-017"
  version: 1
  detection_name: "CMD:SageCommand-Q [Heur]"
  category: tool
  severity: warning
  confidence: 0.85
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}eval{{NOT_FILENAME}}[^;|]*\\b(curl|wget)\\b"
  match_on: command
  title: "Eval executing remote download command"
  expires_at: null
  revoked: false

- id: "CLT-CMD-018"
  version: 1
  detection_name: "CMD:SageCommand-R [Heur]"
  category: tool
  severity: warning
  confidence: 0.85
  # `xargs` is itself anchored with {{CMD_POS}} rather than a bare `\bxargs\b`
  # (which fired on prose merely mentioning xargs). `{{NOT_COMPOUND_LEFT}}`
  # around the dispatched shell/curl name was also a misapplication of that
  # macro: it exists for identifiers that are argument *values* (a WMI class
  # name), never program names, whereas the shell/curl here really is being
  # run. `xargs` is already one of {{CMD_PREFIX}}'s wrapper tokens, so a
  # second `{{CMD_PREFIX}}` application right after the anchored `xargs`
  # naturally skips its own flags (`-I{}`, `-n1`, `-P4`, an intervening
  # `sudo`, ...) before the dispatched program, the same way {{CMD_POS}}
  # skips wrapper tokens before any other program name. Anchoring `xargs`
  # itself (rather than folding it into a generic {{CMD_POS}} on the
  # shell/curl name) keeps this rule scoped to xargs's `{}`-substitution
  # danger specifically — `sudo bash -c "echo {}"` with no xargs anywhere is
  # inert literal text, not a real invocation, and must not fire here (that's
  # CLT-CMD-009/017's territory, not this rule's). curl/wget admit an
  # optional .exe suffix, same as CLT-CMD-001/002; {{SHELLS}} does too for
  # powershell/pwsh via the shared macro.
  pattern: "{{CMD_POS}}xargs{{NOT_FILENAME}}\\s+{{CMD_PREFIX}}(?:(?:{{SHELLS}}){{NOT_FILENAME}}(?:\\s+-[\\w]*c\\b\\s+(?:\"(?!\\s*(?:head|cat|wc)\\b)[^\"\\r\\n]{0,240}(?:\\{\\}|\\$[@*]|\\$\\d)[^\"\\r\\n]{0,240}\"|'(?!\\s*(?:head|cat|wc)\\b)[^'\\r\\n]{0,240}(?:\\{\\}|\\$[@*]|\\$\\d)[^'\\r\\n]{0,240}')|(?!\\s+-[\\w]*c\\b))|(curl|wget)(?:\\.exe)?{{NOT_FILENAME}}[^|;\\r\\n]{0,400}(?:-d|--data|--data-binary|--upload-file|-T|--post-file|--post-data|--body-file)\\b)"
  match_on: command
  title: "xargs dispatching download or shell execution"
  expires_at: null
  revoked: false

- id: "CLT-CMD-019"
  version: 1
  detection_name: "CMD:SageCommand-S [Heur]"
  category: tool
  severity: warning
  confidence: 0.85
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}find{{NOT_FILENAME}}[^|;]*-exec\\s+(?:{{SHELLS}}|curl|wget)\\b"
  match_on: command
  title: "find -exec executing shell or download commands"
  expires_at: null
  revoked: false

