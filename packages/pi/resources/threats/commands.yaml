- id: "CLT-CMD-013"
  version: 1
  detection_name: "CMD:SageCommand-M [Heur]"
  category: network_egress
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009. Had no
  # boundary at all. curl admits an optional .exe suffix, same as CLT-CMD-001.
  pattern: "{{CMD_POS}}curl(?:\\.exe)?{{NOT_FILENAME}}\\s[^|;]*(-d|--data|--data-binary)\\s\\S*(/etc/passwd|/etc/shadow|\\.ssh/|id_rsa|credentials|secrets)"
  match_on: command
