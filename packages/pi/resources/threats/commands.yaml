# --- Pipe to shell (Remote Code Execution) ---
- id: "CLT-CMD-001"
  version: 1
  detection_name: "CMD:SageCommand-A [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{NOT_FILENAME}} on both sides of the pipe, same shape as
  # CLT-CMD-009. Had no boundary at all. curl admits an optional .exe suffix
  # -- it ships as a real Windows binary (built into Windows 10+).
  pattern: "{{CMD_POS}}curl(?:\\.exe)?{{NOT_FILENAME}}\\s[^|]*\\|\\s*(?:{{SHELLS}}){{NOT_FILENAME}}"
  match_on: command
  title: "Remote code execution via curl pipe to shell"
  expires_at: null
  revoked: false

- id: "CLT-CMD-002"
  version: 1
  detection_name: "CMD:SageCommand-B [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-001. wget admits an
  # optional .exe suffix -- real Windows builds exist (GnuWin32, Git for
  # Windows).
  pattern: "{{CMD_POS}}wget(?:\\.exe)?{{NOT_FILENAME}}\\s[^|]*\\|\\s*(?:{{SHELLS}}){{NOT_FILENAME}}"
  match_on: command
  title: "Remote code execution via wget pipe to shell"
  expires_at: null
  revoked: false

# --- Reverse shells ---
- id: "CLT-CMD-003"
  version: 1
  detection_name: "CMD:SageCommand-C [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009. Bare `\b` let
  # the shell name match in quoted prose.
  pattern: "{{CMD_POS}}(?:{{SHELLS}}){{NOT_FILENAME}}\\s+-i\\b[\\s\\S]{0,160}/dev/tcp/"
  match_on: command
  title: "Reverse shell via /dev/tcp"
  expires_at: null
  revoked: false

- id: "CLT-CMD-004"
  version: 1
  detection_name: "CMD:SageCommand-D [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}nc{{NOT_FILENAME}}.*\\s-e\\s"
  match_on: command
  title: "Reverse shell via netcat -e"
  expires_at: null
  revoked: false

- id: "CLT-CMD-005"
  version: 1
  detection_name: "CMD:SageCommand-E [Heur]"
  category: tool
  severity: critical
  confidence: 0.85
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009. Had no
  # boundary at all.
  pattern: "{{CMD_POS}}bash{{NOT_FILENAME}}\\s+-i\\s+>\\s*&\\s*/dev/"
  match_on: command
  title: "Interactive reverse shell via bash"
  expires_at: null
  revoked: false

# --- Destructive operations ---
- id: "CLT-CMD-006"
  version: 1
  detection_name: "CMD:SageCommand-F [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{NOT_FILENAME}} on each alternative's `rm`, same shape as
  # CLT-CMD-009.
  pattern: "{{CMD_POS}}rm{{NOT_FILENAME}}\\s+(-[a-zA-Z]*f[a-zA-Z]*\\s+)?(-[a-zA-Z]*r[a-zA-Z]*\\s+)?/(\\s|$|[;&|*])|{{CMD_POS}}rm{{NOT_FILENAME}}\\s+(-[a-zA-Z]*r[a-zA-Z]*\\s+)?(-[a-zA-Z]*f[a-zA-Z]*\\s+)?/(\\s|$|[;&|*])|{{CMD_POS}}rm{{NOT_FILENAME}}\\s+-[a-zA-Z]*rf[a-zA-Z]*\\s+/(\\s|$|[;&|*])"
  match_on: command
  title: "Recursive forced deletion from root"
  expires_at: null
  revoked: false

- id: "CLT-CMD-007"
  version: 1
  detection_name: "CMD:SageCommand-G [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{HAS_ARG}}, same shape as CLT-CMD-009. The fstype suffix
  # is allowlisted ahead of {{NOT_FILENAME}}'s trailing-dot guard, since
  # mkfs.<fstype> is the real invocation, not a filename, and the old
  # `\bmkfs\b` matched it too. Suffixes are the actual mkfs.* binary names
  # shipped by e2fsprogs, xfsprogs, btrfs-progs, dosfstools, exfatprogs,
  # ntfs-3g, hfsprogs, udftools, util-linux, f2fs-tools, jfsutils,
  # reiserfsprogs, nilfs-utils — not guessed shapes; a fabricated suffix like
  # `fat32` is not a real binary and must not be added on spec alone.
  pattern: "{{CMD_POS}}mkfs(?:\\.(?:ext[234]|xfs|btrfs|vfat|fat|msdos|exfat|ntfs|hfsplus|udf|minix|bfs|cramfs|f2fs|jfs|reiserfs|nilfs2))?{{NOT_FILENAME}}{{HAS_ARG}}"
  match_on: command
  title: "Filesystem format command"
  expires_at: null
  revoked: false

- id: "CLT-CMD-008"
  version: 1
  detection_name: "CMD:SageCommand-H [Heur]"
  category: tool
  severity: warning
  confidence: 0.85
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}dd{{NOT_FILENAME}}\\s+if=.*of=/dev/"
  match_on: command
  title: "Direct disk write via dd"
  expires_at: null
  revoked: false

- id: "CLT-CMD-009"
  version: 1
  detection_name: "CMD:SageCommand-I [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # Requires the binary to actually be executed: a bare word boundary matched
  # filenames (`shred.py`) and path segments (`shred-latency-probe`), and a
  # whitespace boundary also accepted argument position (`man shred | head`).
  # `{{CMD_POS}}` is the shared vocabulary for this — see threats/_macros.yaml
  # and "Writing command-position patterns" in docs/developer-guide.md.
  pattern: "{{CMD_POS}}shred{{NOT_FILENAME}}{{HAS_ARG}}"
  match_on: command
  title: "Secure file destruction via shred"
  expires_at: null
  revoked: false

# --- Download + execute chains ---
- id: "CLT-CMD-010"
  version: 1
  detection_name: "CMD:SageCommand-J [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}} on the fetcher, same shape as CLT-CMD-009,
  # with an optional .exe suffix on each (real Windows binaries). `chmod`
  # itself needs no boundary fix -- it's already anchored to a real
  # separator (`&&`/`;`) literally in the pattern, not a bare mention.
  pattern: "{{CMD_POS}}(curl|wget)(?:\\.exe)?{{NOT_FILENAME}}\\s[\\s\\S]*?(&&|;)\\s*chmod\\s+\\+x"
  match_on: command
  title: "Download and execute chain"
  expires_at: null
  revoked: false

