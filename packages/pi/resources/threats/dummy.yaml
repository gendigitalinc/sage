# Dummy threat patterns for Sage smoke-testing
# Author: Test — NOT real threats
#
# Canary rules that match completely harmless, highly-specific marker strings.
# The markers are deliberately OPAQUE (e.g. "diagmark_cmd_a75bf229", not
# "__sage_test_deny_cmd_..."): a self-describing name reads as a security probe, and
# a safety-trained model given security context (e.g. OpenCode, which injects Sage's
# scan findings into the prompt) will REFUSE to run it — so the artifact never
# reaches Sage and the E2E deny/ask test can't fire. Opaque markers run as rote yet
# stay unique random strings, so false positives are essentially impossible. The
# rule id/title carry the human-readable meaning; the hex suffix aids traceability.
#
# Coverage matrix:
#   Tool           match_on    block(deny)  require_approval(ask)  log(allow)
#   ───────────    ────────    ───────────  ─────────────────────  ──────────
#   Bash           command     ✓ ✓          ✓ ✓                    ✓
#   Write/Edit     file_path   ✓            ✓                      ✓
#   Write/Edit     content     ✓            ✓                      ✓
#   WebFetch/Bash  url         ✓            ✓                      ✓
#   WebFetch/Bash  domain      ✓            —                      —
#
# The file_path rules also cover Read, Delete, Glob, and LS tools
# (they produce the same artifact type).
# The url rules also cover URLs embedded in Bash commands and file content.

# ─── Command patterns (Bash tool) ───────────────────────────────────

- id: "DUMMY-CMD-DENY-001"
  version: 1
  detection_name: "CMD:SageTestCommandDeny-A [Tst]"
  category: testing
  severity: critical
  confidence: 0.95
