# diskpart
- id: "CLT-WIN-CMD-022"
  version: 1
  detection_name: "CMD:SageWindowsCommand-V [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  # {{CMD_POS}}, same shape as CLT-CMD-009. No {{HAS_ARG}}: a bare `diskpart`
  # invocation opens its interactive prompt, which is itself the dangerous
  # case, so a bare mention must still fire. The `.exe` suffix is allowlisted
  # ahead of {{NOT_FILENAME}}'s trailing-dot guard, since `diskpart.exe` is
  # the real Windows invocation, not a filename.
  pattern: "{{CMD_POS}}diskpart(?:\\.exe)?{{NOT_FILENAME}}"
  case_insensitive: true
  match_on: command
  title: "diskpart disk partition manipulation"
  expires_at: null
  revoked: false

