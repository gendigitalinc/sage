# --- PowerShell Download-Execute ---

# Pipe to IEX: irm url | iex, iwr url | iex, curl url | iex, Invoke-WebRequest url | Invoke-Expression
- id: "CLT-WIN-CMD-001"
  version: 1
  detection_name: "CMD:SageWindowsCommand-A [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{NOT_FILENAME}} on both sides of the pipe, same shape as
  # CLT-CMD-009.
  pattern: "{{CMD_POS}}([Ii][Rr][Mm]|[Ii][Ww][Rr]|curl(?:\\.exe)?|wget(?:\\.exe)?|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]nvoke-[Rr]est[Mm]ethod){{NOT_FILENAME}}.*\\|\\s*([Ii][Ee][Xx]|[Ii]nvoke-[Ee]xpression){{NOT_FILENAME}}"
  match_on: command
  title: "PowerShell download piped to Invoke-Expression"
  expires_at: null
  revoked: false

# IEX wrapping download: iex(irm url), IEX((New-Object Net.WebClient).DownloadString(url))
- id: "CLT-WIN-CMD-002"
  version: 1
  detection_name: "CMD:SageWindowsCommand-B [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{NOT_FILENAME}} on the outer IEX call, same shape as
  # CLT-CMD-009. The inner group is an argument inside IEX's own parens, not
  # itself a program name, so it's left as-is.
  pattern: "{{CMD_POS}}([Ii][Ee][Xx]|[Ii]nvoke-[Ee]xpression){{NOT_FILENAME}}\\s*\\(?\\s*\\(?\\s*(\\b([Ii][Rr][Mm]|[Ii][Ww][Rr])\\b|[Nn]ew-[Oo]bject|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]nvoke-[Rr]est[Mm]ethod)"
  match_on: command
  title: "Invoke-Expression wrapping remote download"
  expires_at: null
  revoked: false

