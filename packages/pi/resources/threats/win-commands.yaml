# PowerShell event log clearing
- id: "CLT-WIN-CMD-036"
  version: 1
  detection_name: "CMD:SageWindowsCommand-AJ [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  # A cmdlet occupies command position the same way a binary does — the path
  # prefix {{CMD_POS}} allows is optional, not required, so lacking one isn't
  # a reason to skip it. {{CMD_POS}} also closes the quoted-mention and
  # filename-mention gaps that the symmetric guard alone (see
  # CLT-WIN-PERSIST-008) can't.
  pattern: "{{CMD_POS}}(Clear-EventLog|Remove-EventLog){{NOT_FILENAME}}"
  case_insensitive: true
  match_on: command
  title: "PowerShell event log clearing (anti-forensics)"
  expires_at: null
  revoked: false

