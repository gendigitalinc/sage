# Security service tampering
- id: "CLT-WIN-CMD-038"
  version: 1
  detection_name: "CMD:SageWindowsCommand-AL [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}} on each alternative, same shape as
  # CLT-CMD-009. The whole alternation is wrapped in a non-capturing group so
