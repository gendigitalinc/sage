# Reading credential files on Windows (type, more, Get-Content)
- id: "CLT-WIN-CRED-003"
  version: 1
  detection_name: "CMD:SageWindowsCredential-C [Heur]"
  category: secrets
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-WIN-CMD-036. The old
  # `(^|[^\w-])` boundary accepted any whitespace-delimited position (still
  # excluding a `-type`-shaped flag, which the replacement preserves since
  # {{CMD_POS}} has no valid boundary immediately before a hyphen either).
  pattern: "{{CMD_POS}}(?:type|more|[Gg]et-[Cc]ontent){{NOT_FILENAME}}.*\\.(?:env|credentials|pgpass|netrc)(?=$|[.\\s\"'`;&|)<>])"
  match_on: command
  title: "Reading credential file via type/more/Get-Content"
  expires_at: null
  revoked: false

