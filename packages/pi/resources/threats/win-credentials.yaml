# Mimikatz / sekurlsa
- id: "CLT-WIN-CRED-006"
  version: 1
  detection_name: "CMD:SageWindowsCredential-F [Heur]"
  category: secrets
  severity: critical
  confidence: 0.95
  # Neither {{CMD_POS}} nor {{NOT_COMPOUND_LEFT}} fits here: real invocations
  # routinely have "Mimikatz" as a SUFFIX of a compound name (the PowerSploit
  # function `Invoke-Mimikatz`), not standalone -- {{CMD_POS}} requires a real
  # boundary immediately before it, and {{NOT_COMPOUND_LEFT}} would reject the
  # preceding hyphen, so either would break the single most common real-world
  # invocation shape. `sekurlsa::` is a Mimikatz module reference that's
  # always an argument to something, never itself in command position.
  # {{NOT_AFTER_TEXT_CMD}} alone closes the reported gap (prose/search-command
  # mentions) without touching either loose-substring-matching property.
  # case_insensitive covers casing generally, so the term itself no longer
  # needs hand-cased character classes -- and it must be set here regardless,
  # since {{NOT_AFTER_TEXT_CMD}}'s denylist (Select-String, Write-Host, ...)
  # is fixed-case and silently stops suppressing lowercase/mixed-case
  # invocations without it. See CLT-WIN-PERSIST-008 for the same macro used
  # the same way.
  pattern: "{{NOT_AFTER_TEXT_CMD}}(?:mimikatz|sekurlsa::)"
  case_insensitive: true
  match_on: command
  title: "Mimikatz credential dumping tool"
  expires_at: null
  revoked: false

# Registry hive export for credential theft
- id: "CLT-WIN-CRED-007"
  version: 1
  detection_name: "CMD:SageWindowsCredential-G [Heur]"
  category: secrets
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}reg(?:\\.exe)?{{NOT_FILENAME}}\\s+save\\b.*\\bHKLM\\\\(SAM|SYSTEM|SECURITY)\\b"
  match_on: command
  title: "Registry hive export for credential theft (reg save HKLM\\SAM/SYSTEM)"
  expires_at: null
  revoked: false

# LSASS credential dumping
- id: "CLT-WIN-CRED-008"
  version: 1
  detection_name: "CMD:SageWindowsCredential-H [Heur]"
  category: secrets
  severity: critical
  confidence: 0.95
  # {{CMD_POS}} + {{NOT_FILENAME}} on each leading verb, same shape as
  # CLT-CMD-009. Optional `.exe` suffix ahead of {{NOT_FILENAME}}, same as
  # CLT-MITRE-096 (tscon) -- otherwise `rundll32.exe` would fail to match,
  # since {{NOT_FILENAME}} itself rejects a trailing dot. The internal
  # `\blsass\b`/`\bcomsvcs\b`/`\bMiniDump\b` mentions are left as bare --
  # only reachable once the leading verb has already matched at command
  # position.
  pattern: "{{CMD_POS}}(procdump|procdump64)(?:\\.exe)?{{NOT_FILENAME}}.*\\blsass\\b|{{CMD_POS}}rundll32(?:\\.exe)?{{NOT_FILENAME}}.*\\bcomsvcs(\\.dll)?\\b.*\\bMiniDump\\b"
  match_on: command
  title: "LSASS credential dumping (procdump/comsvcs.dll MiniDump)"
  expires_at: null
  revoked: false

