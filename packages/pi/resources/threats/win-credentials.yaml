# cmdkey stored credentials
- id: "CLT-WIN-CRED-001"
  version: 1
  detection_name: "CMD:SageWindowsCredential-A [Heur]"
  category: secrets
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}[Cc]mdkey(?:\\.exe)?{{NOT_FILENAME}}\\s+/add:"
  match_on: command
  title: "Stored credential creation via cmdkey"
  expires_at: null
  revoked: false

