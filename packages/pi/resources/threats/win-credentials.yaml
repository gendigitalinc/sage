# --- Windows copy/move/link of secret files ---
- id: "CLT-WIN-CRED-010"
  version: 1
  detection_name: "CMD:SageWindowsCredential-J [Heur]"
  category: secrets
  severity: warning
  confidence: 0.60
  # Protected files: .env*, .aws\credentials, .ssh\(id_rsa|id_ed25519|id_ecdsa|id_dsa),
  # .netrc, .pgpass, .npmrc, .pypirc, key.properties, .docker\config.json,
  # kubeconfig, .kube\config, master.key, credentials.yml
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009. xcopy/robocopy
  # are real standalone binaries and admit an optional `.exe` suffix; copy/
  # mklink are cmd builtins and Copy-Item/Move-Item are cmdlets, neither of
  # which has a `.exe` form.
  pattern: "{{CMD_POS}}(copy|xcopy(?:\\.exe)?|robocopy(?:\\.exe)?|Copy-Item|Move-Item|mklink){{NOT_FILENAME}}.*(?<=[\\\\/\\s])(\\.env(?!\\S*\\.(example|sample|template|dist)\\b)(\\.\\w+)?(?=[\\s\\\\/]|$)|\\.aws[\\\\/]credentials|\\.ssh[\\\\/](id_rsa|id_ed25519|id_ecdsa|id_dsa)|\\.netrc|\\.pgpass|\\.npmrc|\\.pypirc|key\\.properties|\\.docker[\\\\/]config\\.json|kubeconfig|\\.kube[\\\\/]config|master\\.key|credentials\\.yml)"
  case_insensitive: true
  match_on: command
  title: "Windows copy/move of credential or secret file"
  expires_at: null
  revoked: false
