# macOS persistence mechanism threat patterns for Sage
# Author: Gen Digital Inc.
# License: DRL-1.1 (see threats/LICENSE)
# Covers: LaunchAgents, Login Items, Authorization plugins, periodic scripts, emond, dylib hijack

# LaunchAgent/LaunchDaemon plist (migrated from persistence.yaml CLT-PERSIST-004)
- id: "CLT-MAC-PERSIST-001"
  version: 1
  detection_name: "CMD:SageMacOSPersistence-A [Heur]"
  category: tool
  severity: warning
  confidence: 0.90
  pattern: "(LaunchAgents|LaunchDaemons)/.*\\.plist"
  match_on: command
  title: "macOS LaunchAgent/LaunchDaemon persistence"
  expires_at: null
  revoked: false

# Login Items via osascript
- id: "CLT-MAC-PERSIST-002"
  version: 1
  detection_name: "CMD:SageMacOSPersistence-B [Heur]"
  category: tool
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009.
  pattern: "{{CMD_POS}}osascript{{NOT_FILENAME}}.*login item"
  case_insensitive: true
  match_on: command
  title: "Add login item via osascript"
  expires_at: null
  revoked: false

# Login window manipulation via defaults
- id: "CLT-MAC-PERSIST-003"
  version: 1
  detection_name: "CMD:SageMacOSPersistence-C [Heur]"
  category: tool
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}} on `defaults`, same shape as CLT-CMD-009.
  # The inner `\bwrite\b` is left as bare -- only reachable once `defaults`
  # has already matched at command position.
  pattern: "{{CMD_POS}}defaults{{NOT_FILENAME}}.*\\bwrite\\b.*loginwindow.*(AutoLaunch|LoginHook|LogoutHook)"
  case_insensitive: true
  match_on: command
  title: "Login window hook manipulation via defaults write"
  expires_at: null
  revoked: false

