# launchctl load/bootstrap persistent agent
- id: "CLT-MAC-PERSIST-009"
  version: 1
  detection_name: "CMD:SageMacOSPersistence-I [Heur]"
  category: tool
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}} on `launchctl`, same shape as CLT-CMD-009.
  # The inner `\b(load|bootstrap)\b` is left as bare -- only reachable once
  # `launchctl` has already matched at command position.
  pattern: "{{CMD_POS}}launchctl{{NOT_FILENAME}}.*\\b(load|bootstrap)\\b"
  match_on: command
  title: "Load persistent launch agent/daemon via launchctl"
  expires_at: null
  revoked: false
