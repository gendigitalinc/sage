# Self-defense patterns — protect Sage and Claude Code configuration
# Author: Gen Digital Inc.
# License: DRL-1.1 (see threats/LICENSE)
# These flag when the AI agent may be manipulated into disabling its own guardrails
# Using require_approval (not block) to allow legitimate plugin dev and config changes

# Delete .sage directory
- id: "CLT-SELF-001"
  version: 1
  detection_name: "CMD:SageSelfDefense-A [Heur]"
  category: self_defense
  severity: critical
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009. The bare
  # verb alternation fired on prose warning against the deletion (this is
  # Sage's own self-protection rule, so an agent merely explaining not to
  # delete .sage would self-trigger it).
  pattern: "{{CMD_POS}}(rm|del|rmdir|rd|Remove-Item|unlink){{NOT_FILENAME}}\\s.*\\.sage(\\s|[\\\\/]|$)"
  case_insensitive: true
  match_on: command
  title: "Attempt to delete Sage configuration directory"
  expires_at: null
  revoked: false

# Access Sage config files
- id: "CLT-SELF-002"
  version: 1
  detection_name: "FN:SageSelfDefense-B [Heur]"
  category: self_defense
  severity: warning
  confidence: 0.60
  pattern: "\\.sage[\\\\/](config|exceptions|pending-exceptions)\\.json"
  match_on: file_path
  title: "Access Sage configuration files"
  expires_at: null
  revoked: false

# Delete Claude Code hook or plugin config
- id: "CLT-SELF-003"
  version: 1
  detection_name: "CMD:SageSelfDefense-C [Heur]"
  category: self_defense
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-SELF-001 above.
  pattern: "{{CMD_POS}}(rm|del|Remove-Item|unlink){{NOT_FILENAME}}\\s.*\\.claude[\\\\/].*(hooks\\.json|installed_plugins)"
  case_insensitive: true
  match_on: command
  title: "Attempt to delete Claude Code hook or plugin configuration"
  expires_at: null
  revoked: false

# Disable Sage security features via config
- id: "CLT-SELF-004"
  version: 1
  detection_name: "Other:SageSelfDefense-D [Heur]"
  category: self_defense
  severity: warning
  confidence: 0.60
  pattern: "\"heuristics_enabled\"\\s*:\\s*false|\"url_check\"\\s*:\\s*\\{[^}]*\"enabled\"\\s*:\\s*false"
  match_on: content
  title: "Attempt to disable Sage security features via config"
  expires_at: null
  revoked: false
