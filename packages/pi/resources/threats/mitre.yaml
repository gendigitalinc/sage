# --- T1105: Ingress Tool Transfer ---
- id: "CLT-MITRE-041"
  version: 1
  detection_name: "CMD:SageMitre-AO [Heur]"
  category: command_and_control
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}} on each alternative, same shape as
  # CLT-CMD-009. The `New-Object` branch keeps its literal opening paren
  # instead of {{CMD_POS}} -- the closing `\)` is already a literal
  # requirement, so pairing it with {{CMD_POS}}'s wider boundary set (`;`,
  # `&`, `|`, ...) would accept an unmatched close paren with nothing real to
  # pair it with. Same pipe-boundary exception shape as CLT-MAC-CMD-003.
  pattern: "{{CMD_POS}}certutil(?:\\.exe)?{{NOT_FILENAME}}.*-(decode|decodehex|encode|ping|url|urlcache|verifyctl)|{{CMD_POS}}MpCmdRun(?:\\.exe)?{{NOT_FILENAME}}.*-DownloadFile.*-url.*http|\\(New-Object{{NOT_FILENAME}} System\\.Net\\.WebClient\\)\\.DownloadFile|{{CMD_POS}}bitsadmin(?:\\.exe)?{{NOT_FILENAME}}.*/(transfer|download|create|addfile|setnotifycmdline|resume|complete)|{{CMD_POS}}Start-BitsTransfer{{NOT_FILENAME}}"
  case_insensitive: true
  match_on: command
  title: "MITRE ATT&CK T1105 - Ingress Tool Transfer"
  expires_at: null
  revoked: false

