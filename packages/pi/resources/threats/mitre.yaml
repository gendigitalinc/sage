# --- T1003.001: LSASS Memory ---
- id: "CLT-MITRE-001"
  version: 1
  detection_name: "CMD:SageMitre-A [Heur]"
  category: credential_access
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}} on the two program names, same shape as
  # CLT-CMD-009. The `sekurlsa::` module references are left as-is -- like
  # WIN-CRED-006's Mimikatz rule, they're arguments to a running mimikatz
  # session, never a program name themselves.
  pattern: "{{CMD_POS}}rundll32(?:\\.exe)?{{NOT_FILENAME}}.*comsvcs\\.dll,MiniDump.*|{{CMD_POS}}procdump(?:\\.exe)?{{NOT_FILENAME}}.*-ma.*lsass\\.exe.*lsass_dump|sekurlsa::Minidump.*lsassdump\\.dmp|sekurlsa::logonPasswords"
  case_insensitive: true
  match_on: command
  title: "MITRE ATT&CK T1003.001 - LSASS Memory"
  expires_at: null
  revoked: false

