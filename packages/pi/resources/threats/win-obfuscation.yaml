  detection_name: "CMD:SageWindowsObfuscation-N [Heur]"
  category: tool
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-WIN-OBFUS-013.
  pattern: "{{CMD_POS}}cmd(?:\\.exe)?{{NOT_FILENAME}}.*(%[^%]+:~[^%]*%[a-z]*){2}"
  case_insensitive: true
  match_on: command
  title: "cmd substring concatenation obfuscation"
  expires_at: null
