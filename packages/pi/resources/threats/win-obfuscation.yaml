# wscript/cscript //E: engine override on non-script files
- id: "CLT-WIN-OBFUS-009"
  version: 1
  detection_name: "CMD:SageWindowsObfuscation-I [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}} instead of a leading bare alternation with
  # no command-position boundary; {{NOT_FILENAME}} replaces the trailing
  # `\b`, same effect but also rejects a trailing dot.
  pattern: "{{CMD_POS}}(wscript|cscript)(?:\\.exe)?{{NOT_FILENAME}}.*//[Ee]:([Vv][Bb][Ss]cript|[Jj][Ss]cript)"
  case_insensitive: true
  match_on: command
  title: "wscript/cscript script engine override (//E:VBScript evasion)"
  expires_at: null
  revoked: false

