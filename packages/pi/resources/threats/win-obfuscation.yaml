# PowerShell -EncodedCommand
- id: "CLT-WIN-OBFUS-001"
  version: 1
  detection_name: "CMD:SageWindowsObfuscation-A [Heur]"
  category: tool
  severity: critical
  confidence: 0.95
  pattern: "-[Ee]nc(oded[Cc]ommand)?\\s+[A-Za-z0-9+/=]{20,}"
  match_on: command
  title: "PowerShell -EncodedCommand with base64 payload"
  expires_at: null
  revoked: false

# certutil -decode
- id: "CLT-WIN-OBFUS-002"
  version: 1
  detection_name: "CMD:SageWindowsObfuscation-B [Heur]"
  category: tool
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-CMD-009. Had no
  # boundary at all.
  pattern: "{{CMD_POS}}[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll](?:\\.exe)?{{NOT_FILENAME}}\\s.*-decode"
  match_on: command
  title: "certutil base64 decode (obfuscation)"
  expires_at: null
  revoked: false

