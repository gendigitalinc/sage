# mshta VBScript execution (Execute, CreateObject, close patterns)
- id: "CLT-WIN-OBFUS-007"
  version: 1
  detection_name: "CMD:SageWindowsObfuscation-G [Heur]"
  category: tool
  severity: critical
  confidence: 0.90
  # {{CMD_POS}} + {{NOT_FILENAME}}, same shape as CLT-MITRE-096 (tscon),
  # including the optional `.exe` suffix ahead of {{NOT_FILENAME}} (which
  # itself rejects a trailing dot).
  pattern: "{{CMD_POS}}mshta(?:\\.exe)?{{NOT_FILENAME}}.*\\bvbscript:(Execute|CreateObject|close\\s*\\()"
  case_insensitive: true
  match_on: command
  title: "mshta VBScript execution (Execute/CreateObject obfuscation)"
  expires_at: null
  revoked: false

