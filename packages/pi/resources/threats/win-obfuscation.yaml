# cmd caret obfuscation (ex CLT-TECH-014)
- id: "CLT-WIN-OBFUS-013"
  version: 1
  detection_name: "CMD:SageWindowsObfuscation-M [Heur]"
  category: tool
  severity: warning
  confidence: 0.60
  # {{CMD_POS}} + {{NOT_FILENAME}} (with optional `.exe` suffix), same shape
  # as CLT-MITRE-096. Had no boundary at all -- not even a `\b` -- so `cmd`
  # matched as a bare substring of `cmdlet` or similar.
  pattern: "{{CMD_POS}}cmd(?:\\.exe)?{{NOT_FILENAME}}.*([^\\^]\\^[a-z].*){5}"
  case_insensitive: true
  match_on: command
  title: "cmd caret (^) obfuscation"
  expires_at: null
  revoked: false

# cmd substring concatenation obfuscation (ex CLT-TECH-015)
- id: "CLT-WIN-OBFUS-014"
